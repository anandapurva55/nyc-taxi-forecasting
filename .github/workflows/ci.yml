# Public quality gate: runs on every push to main and every pull request and
# reports the result on GitHub. Releases are built and deployed by AWS
# CodeBuild (buildspec.yml), which repeats the lint and test step as a final
# gate before any image reaches ECR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Pytest with coverage gate
        run: uv run --frozen pytest --cov=src --cov-report=term-missing
      - name: Known vulnerabilities in every locked package
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes --format requirements-txt > locked.txt
          uv run --frozen pip-audit --requirement locked.txt --no-deps --disable-pip --strict

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
