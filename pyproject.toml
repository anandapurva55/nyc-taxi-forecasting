[project]
name = "nyc-taxi-forecasting"
version = "1.0.0"
description = "NYC taxi demand and fare forecasting with an end-to-end MLOps platform on AWS."
requires-python = "==3.11.*"
# Runtime of the API, batch inference and the monitoring jobs. Packages with
# known vulnerabilities are held at or above their first patched release; the
# rest stay on the versions the registered models were trained with.
dependencies = [
    # Core data stack
    "pandas>=2.3,<3",
    "numpy==1.26.4",
    "pyarrow>=23.0.1,<24",
    "python-dateutil==2.9.0.post0",
    "holidays==0.109",
    # Models (needed to load the registered estimators)
    "scikit-learn==1.5.2",
    "xgboost==2.0.3",
    "lightgbm>=4.6.0",
    # Model registry and explanations
    "mlflow>=3.17.2,<4",
    "protobuf>=5.29.6",
    "shap==0.45.1",
    "matplotlib==3.11.2",
    # Config and utilities
    "pyyaml==6.0.4",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    # Serving
    "fastapi>=0.116",
    "starlette>=0.47.2",
    "uvicorn[standard]>=0.30.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[dependency-groups]
# Training, notebooks, tests and security checks.
dev = [
    "optuna==3.6.2",
    "httpx>=0.27.0",
    "ruff==0.17.6",
    "jupyterlab>=4.6.4",
    "nbformat>=5.10.4",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
    "pillow>=12.1.1",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.10.1",
]
# Streamlit dashboard image: talks to the API over HTTP, so no ML stack.
dashboard = [
    "pandas>=2.3,<3",
    "numpy==1.26.4",
    "pyarrow>=23.0.1,<24",
    "requests>=2.33.0",
    "streamlit>=1.37.1",
    "plotly>=5.23.0",
]
# SageMaker Processing image for the drift and live accuracy jobs.
monitoring = [
    "boto3>=1.34",
]
# Optional: SageMaker SDK for training and pipeline scripts, Evidently HTML reports.
aws = [
    "boto3>=1.34",
    "sagemaker>=2.257.2,<3",
    "evidently>=0.4,<0.8",
]

[tool.uv]
# An application, not a library: install dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "mlruns", "data", "artifacts", "notebooks"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # FastAPI dependency-injection idiom uses Depends() in defaults
]

[tool.ruff.lint.isort]
# Pin first-party detection so import ordering is identical across environments
# (local working copy vs. clean CI checkout, which otherwise auto-detect differently).
known-first-party = ["src"]
known-third-party = ["mlflow"]
