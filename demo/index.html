<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NYC Taxi Forecasting: interactive demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Generated by scripts/build_static_demo.py. The web app's own Streamlit code runs in the
         browser with stlite, and answers come from recording.json, recorded from the real API. -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";
      mount(
        {
          requirements: ["pandas", "plotly", "requests", "lightgbm", "holidays", "pyyaml"],
          entrypoint: "streamlit_app.py",
          files: {
          "streamlit_app.py": `import os, runpy
os.environ["TAXI_DEMO"] = "1"
runpy.run_path("dashboard/app.py", run_name="__main__")
`,
          "artifacts/drift/demand_drift_metrics.json": { url: "./assets/drift/demand_drift_metrics.json" },
          "artifacts/drift/fare_booking_drift_metrics.json": { url: "./assets/drift/fare_booking_drift_metrics.json" },
          "artifacts/drift/fare_drift_metrics.json": { url: "./assets/drift/fare_drift_metrics.json" },
          "artifacts/responsible/demand_fairness.json": { url: "./assets/responsible/demand_fairness.json" },
          "artifacts/responsible/demand_shap_summary.png": { url: "./assets/responsible/demand_shap_summary.png" },
          "artifacts/responsible/fare_booking_fairness.json": { url: "./assets/responsible/fare_booking_fairness.json" },
          "artifacts/responsible/fare_booking_shap_summary.png": { url: "./assets/responsible/fare_booking_shap_summary.png" },
          "artifacts/responsible/fare_fairness.json": { url: "./assets/responsible/fare_fairness.json" },
          "artifacts/responsible/fare_shap_summary.png": { url: "./assets/responsible/fare_shap_summary.png" },
          "config/config.yaml": { url: "./config/config.yaml" },
          "dashboard/__init__.py": { url: "./dashboard/__init__.py" },
          "dashboard/api_client.py": { url: "./dashboard/api_client.py" },
          "dashboard/app.py": { url: "./dashboard/app.py" },
          "dashboard/config.py": { url: "./dashboard/config.py" },
          "dashboard/data.py": { url: "./dashboard/data.py" },
          "dashboard/demo_backend.py": { url: "./dashboard/demo_backend.py" },
          "dashboard/demo_models.py": { url: "./dashboard/demo_models.py" },
          "dashboard/sections.py": { url: "./dashboard/sections.py" },
          "data/raw/taxi_zone_lookup.csv": { url: "./assets/taxi_zone_lookup.csv" },
          "demo/models/fare.txt": { url: "./models/fare.txt" },
          "demo/models/fare_booking.txt": { url: "./models/fare_booking.txt" },
          "demo/recording.json": { url: "./recording.json" },
          "docs/model_cards/README.md": { url: "./docs/model_cards/README.md" },
          "docs/model_cards/demand.md": { url: "./docs/model_cards/demand.md" },
          "docs/model_cards/fare.md": { url: "./docs/model_cards/fare.md" },
          "docs/model_cards/fare_booking.md": { url: "./docs/model_cards/fare_booking.md" },
          "src/__init__.py": { url: "./src/__init__.py" },
          "src/config.py": { url: "./src/config.py" },
          "src/features/__init__.py": { url: "./src/features/__init__.py" },
          "src/features/calendar.py": { url: "./src/features/calendar.py" },
          "src/features/demand_features.py": { url: "./src/features/demand_features.py" },
          "src/features/duration.py": { url: "./src/features/duration.py" },
          "src/features/fare_features.py": { url: "./src/features/fare_features.py" },
          "src/features/zones.py": { url: "./src/features/zones.py" },
          "src/serving/__init__.py": { url: "./src/serving/__init__.py" },
          "src/serving/features.py": { url: "./src/serving/features.py" },
          "src/serving/predict.py": { url: "./src/serving/predict.py" }
          },
          streamlitConfig: { "client.toolbarMode": "viewer" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
