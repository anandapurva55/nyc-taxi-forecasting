# AWS CodeBuild CI/CD for the taxi-forecasting API.
#
# Runs on every push/PR (webhook). It always lints + tests. On a push to the
# default branch (exact match) it additionally builds the SELF-CONTAINED image and
# deploys. A manual start deploys only when DEPLOY_MANUAL=true is passed:
#   test -> fetch baked artifacts from S3 -> build image -> push to ECR -> roll ECS.
# Each image is tagged with its commit (git-<sha>) and carries build_info.json.
# A build started from a source archive instead of GitHub passes SOURCE_LABEL
# (for example prerelease-20261117), which is used as the tag and recorded commit.
#
# The image bakes in mlruns/, mlflow.db and the demand-history parquet, which are
# gitignored (absent from the checkout). CodeBuild pulls them from
# s3://$ARTIFACTS_BUCKET/ (upload once with scripts/aws/upload_artifacts.ps1).
#
# Required project env vars (set by Terraform in infra/terraform/cicd.tf):
#   AWS_REGION, ECR_REPOSITORY_URL, ECS_CLUSTER, ECS_SERVICE, ARTIFACTS_BUCKET,
#   IMAGE_TAG, DEPLOY_BRANCH.

version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt -c requirements.lock

  pre_build:
    commands:
      - echo "Ruff lint"
      - ruff check .
      - echo "Pytest with coverage"
      - pytest --cov=src --cov-report=term-missing --cov-report=xml
      # Decide whether this run should also build + deploy (push to DEPLOY_BRANCH).
      - |
        DEPLOY="false"
        # Exact match: a push to "main-hotfix" must not deploy when DEPLOY_BRANCH is "main".
        if [ "$CODEBUILD_WEBHOOK_EVENT" = "PUSH" ] && [ "$CODEBUILD_WEBHOOK_HEAD_REF" = "refs/heads/${DEPLOY_BRANCH}" ]; then
          DEPLOY="true"
        fi
        # Manual starts deploy only when explicitly requested with DEPLOY_MANUAL=true.
        if [ -z "$CODEBUILD_WEBHOOK_EVENT" ] && [ "${DEPLOY_MANUAL:-false}" = "true" ]; then
          DEPLOY="true"
        fi
        echo "DEPLOY=$DEPLOY" > deploy.env
        echo "Deploy this run: $DEPLOY"

  build:
    commands:
      - . ./deploy.env
      - |
        if [ "$DEPLOY" != "true" ]; then
          echo "Not the deploy branch - skipping image build/deploy."
          exit 0
        fi
      - echo "Fetching baked artifacts from s3://$ARTIFACTS_BUCKET"
      - aws s3 sync "s3://$ARTIFACTS_BUCKET/mlruns" ./mlruns --only-show-errors
      - aws s3 cp "s3://$ARTIFACTS_BUCKET/mlflow.db" ./mlflow.db --only-show-errors
      - mkdir -p data/processed
      - aws s3 cp "s3://$ARTIFACTS_BUCKET/demand_hourly.parquet" ./data/processed/demand_hourly.parquet --only-show-errors
      - echo "Generating container-portable MLflow DB"
      - python scripts/make_mlflow_portable.py --src mlflow.db --dest mlflow.container.db --new-base "file:///app/mlruns"
      - echo "Recording build provenance (commit, model versions, input hashes)"
      - SOURCE_ID="${SOURCE_LABEL:-$CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - python scripts/write_build_info.py --commit "$SOURCE_ID"
      - echo "Logging in to ECR"
      - REGISTRY="${ECR_REPOSITORY_URL}"
      - REGISTRY="${REGISTRY%%/*}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      # Every image is tagged with its commit, so any release can be rolled back exactly.
      - |
        if [ -n "$SOURCE_LABEL" ]; then
          COMMIT_TAG="$SOURCE_LABEL"
        else
          COMMIT_TAG="git-$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)"
        fi
      - IMAGE="${ECR_REPOSITORY_URL}:${COMMIT_TAG}"
      - echo "Building and pushing $IMAGE"
      - docker build -f docker/Dockerfile -t "$IMAGE" .
      - docker push "$IMAGE"
      - |
        if [ "$IMAGE_TAG" != "$COMMIT_TAG" ]; then
          echo "Also publishing as ${ECR_REPOSITORY_URL}:${IMAGE_TAG} for the current ECS task definition"
          docker tag "$IMAGE" "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
        fi

  post_build:
    commands:
      - . ./deploy.env
      - |
        if [ "$DEPLOY" != "true" ]; then
          echo "CI (test-only) complete."
          exit 0
        fi
      - echo "Rolling ECS service $ECS_SERVICE"
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_REGION"
      - echo "Deploy complete."

artifacts:
  files:
    - coverage.xml
  name: coverage
